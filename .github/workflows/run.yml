name: run
run-name: "run ${{ inputs.task }}"
# A generic launcher: every job checks out the private code and runs one step of a task
# (scripts/runner.py there); what a task is, and everything it produces, stays private.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "task"
        required: true
      ref:
        description: "branch"
        required: false
        default: "main"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      a: ${{ steps.plan.outputs.a }}
      b: ${{ steps.plan.outputs.b }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {repo-key: "${{ secrets.PRIVATE_REPO_KEY }}", access-key: "${{ secrets.R2_ACCESS_KEY }}", secret-key: "${{ secrets.R2_SECRET_KEY }}", ref: "${{ inputs.ref }}"}
      - id: plan
        working-directory: code
        run: uv run scripts/runner.py plan "${{ inputs.task }}"

  work-a:
    needs: plan
    if: ${{ needs.plan.outputs.a != '[]' }}
    name: ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.a) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {repo-key: "${{ secrets.PRIVATE_REPO_KEY }}", access-key: "${{ secrets.R2_ACCESS_KEY }}", secret-key: "${{ secrets.R2_SECRET_KEY }}", ref: "${{ inputs.ref }}"}
      - working-directory: code
        run: uv run scripts/runner.py work "${{ inputs.task }}" "${{ matrix.n }}" 1

  work-b:
    needs: plan
    if: ${{ needs.plan.outputs.b != '[]' }}
    name: ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        n: ${{ fromJSON(needs.plan.outputs.b) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {repo-key: "${{ secrets.PRIVATE_REPO_KEY }}", access-key: "${{ secrets.R2_ACCESS_KEY }}", secret-key: "${{ secrets.R2_SECRET_KEY }}", ref: "${{ inputs.ref }}"}
      - working-directory: code
        run: uv run scripts/runner.py work "${{ inputs.task }}" "${{ matrix.n }}" 1

  blocked-1:
    needs: [plan, work-a, work-b]
    if: ${{ always() && needs.plan.result == 'success' }}
    name: refused 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      items: ${{ steps.b.outputs.items }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {repo-key: "${{ secrets.PRIVATE_REPO_KEY }}", access-key: "${{ secrets.R2_ACCESS_KEY }}", secret-key: "${{ secrets.R2_SECRET_KEY }}", ref: "${{ inputs.ref }}"}
      - id: b
        working-directory: code
        run: uv run scripts/runner.py blocked "${{ inputs.task }}"

  retry-1:
    needs: blocked-1
    if: ${{ always() && needs.blocked-1.outputs.items != '' && needs.blocked-1.outputs.items != '[]' }}
    name: ${{ matrix.n }} retry#1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        n: ${{ fromJSON(needs.blocked-1.outputs.items) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {repo-key: "${{ secrets.PRIVATE_REPO_KEY }}", access-key: "${{ secrets.R2_ACCESS_KEY }}", secret-key: "${{ secrets.R2_SECRET_KEY }}", ref: "${{ inputs.ref }}"}
      - working-directory: code
        run: uv run scripts/runner.py work "${{ inputs.task }}" "${{ matrix.n }}" 2

  blocked-2:
    needs: [blocked-1, retry-1]
    if: ${{ always() && needs.retry-1.result != 'skipped' && needs.retry-1.result != 'cancelled' }}
    name: refused 2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      items: ${{ steps.b.outputs.items }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {repo-key: "${{ secrets.PRIVATE_REPO_KEY }}", access-key: "${{ secrets.R2_ACCESS_KEY }}", secret-key: "${{ secrets.R2_SECRET_KEY }}", ref: "${{ inputs.ref }}"}
      - id: b
        working-directory: code
        run: uv run scripts/runner.py blocked "${{ inputs.task }}"

  retry-2:
    needs: blocked-2
    if: ${{ always() && needs.blocked-2.outputs.items != '' && needs.blocked-2.outputs.items != '[]' }}
    name: ${{ matrix.n }} retry#2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        n: ${{ fromJSON(needs.blocked-2.outputs.items) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {repo-key: "${{ secrets.PRIVATE_REPO_KEY }}", access-key: "${{ secrets.R2_ACCESS_KEY }}", secret-key: "${{ secrets.R2_SECRET_KEY }}", ref: "${{ inputs.ref }}"}
      - working-directory: code
        run: uv run scripts/runner.py work "${{ inputs.task }}" "${{ matrix.n }}" 3

  blocked-3:
    needs: [blocked-2, retry-2]
    if: ${{ always() && needs.retry-2.result != 'skipped' && needs.retry-2.result != 'cancelled' }}
    name: refused 3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      items: ${{ steps.b.outputs.items }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {repo-key: "${{ secrets.PRIVATE_REPO_KEY }}", access-key: "${{ secrets.R2_ACCESS_KEY }}", secret-key: "${{ secrets.R2_SECRET_KEY }}", ref: "${{ inputs.ref }}"}
      - id: b
        working-directory: code
        run: uv run scripts/runner.py blocked "${{ inputs.task }}"

  retry-3:
    needs: blocked-3
    if: ${{ always() && needs.blocked-3.outputs.items != '' && needs.blocked-3.outputs.items != '[]' }}
    name: ${{ matrix.n }} retry#3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        n: ${{ fromJSON(needs.blocked-3.outputs.items) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {repo-key: "${{ secrets.PRIVATE_REPO_KEY }}", access-key: "${{ secrets.R2_ACCESS_KEY }}", secret-key: "${{ secrets.R2_SECRET_KEY }}", ref: "${{ inputs.ref }}"}
      - working-directory: code
        run: uv run scripts/runner.py work "${{ inputs.task }}" "${{ matrix.n }}" 4

  blocked-4:
    needs: [blocked-3, retry-3]
    if: ${{ always() && needs.retry-3.result != 'skipped' && needs.retry-3.result != 'cancelled' }}
    name: refused 4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      items: ${{ steps.b.outputs.items }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {repo-key: "${{ secrets.PRIVATE_REPO_KEY }}", access-key: "${{ secrets.R2_ACCESS_KEY }}", secret-key: "${{ secrets.R2_SECRET_KEY }}", ref: "${{ inputs.ref }}"}
      - id: b
        working-directory: code
        run: uv run scripts/runner.py blocked "${{ inputs.task }}"

  retry-4:
    needs: blocked-4
    if: ${{ always() && needs.blocked-4.outputs.items != '' && needs.blocked-4.outputs.items != '[]' }}
    name: ${{ matrix.n }} retry#4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        n: ${{ fromJSON(needs.blocked-4.outputs.items) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {repo-key: "${{ secrets.PRIVATE_REPO_KEY }}", access-key: "${{ secrets.R2_ACCESS_KEY }}", secret-key: "${{ secrets.R2_SECRET_KEY }}", ref: "${{ inputs.ref }}"}
      - working-directory: code
        run: uv run scripts/runner.py work "${{ inputs.task }}" "${{ matrix.n }}" 5

  finish:
    needs: [plan, work-a, work-b, blocked-1, retry-1, blocked-2, retry-2, blocked-3, retry-3, blocked-4, retry-4]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: {repo-key: "${{ secrets.PRIVATE_REPO_KEY }}", access-key: "${{ secrets.R2_ACCESS_KEY }}", secret-key: "${{ secrets.R2_SECRET_KEY }}", ref: "${{ inputs.ref }}"}
      - working-directory: code
        run: uv run scripts/runner.py finish "${{ inputs.task }}"
